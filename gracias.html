<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Plaza confirmada! | Dicharm Dance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Bebas+Neue&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Poppins',Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,43,214,.25), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(30,107,255,.25), transparent 45%),
      #06040a;
    color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px;
  }
  .card{max-width:480px;}
  .check{font-size:64px; margin-bottom:20px;}
  h1{font-family:'Bebas Neue',sans-serif; font-size:42px; margin-bottom:14px;
     background:linear-gradient(90deg,#ff2bd6,#8a2be2,#1e6bff); -webkit-background-clip:text; background-clip:text; color:transparent;}
  p{color:#b9b3c9; font-size:16px; margin-bottom:10px;}
  a.btn{
    display:inline-block; margin-top:24px; padding:14px 32px; border-radius:50px;
    background:linear-gradient(90deg,#ff2bd6,#8a2be2,#1e6bff); color:#fff; text-decoration:none; font-weight:700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">🎉</div>
    <h1>¡Tu plaza está confirmada!</h1>
    <p>Hemos recibido tu pago correctamente. Te hemos enviado un email de confirmación con todos los detalles.</p>
    <p>¡Nos vemos en la pista en Septiembre! 💃🕺</p>
    <a class="btn" href="/">Volver a la web</a>
  </div>
</body>
</html>
